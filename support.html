<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Wolf | Support & Troubleshooting Request</title>
<style>
  :root {
    --navy: #0f1f33;
    --navy-light: #1c3352;
    --steel: #4a5a70;
    --accent: #e08a1e;
    --bg: #f5f6f8;
    --white: #ffffff;
    --border: #d8dce2;
    --danger: #c0392b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--navy);
  }

  header {
    background: var(--navy);
    color: var(--white);
    padding: 28px 20px;
    text-align: center;
  }

  header h1 {
    margin: 0 0 6px 0;
    font-size: 24px;
    letter-spacing: 0.5px;
  }

  header p {
    margin: 0;
    color: #b9c4d3;
    font-size: 14px;
  }

  .wrap {
    max-width: 640px;
    margin: 30px auto;
    padding: 0 16px 60px 16px;
  }

  form {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 30px 30px 20px 30px;
  }

  fieldset {
    border: none;
    padding: 0;
    margin: 0 0 22px 0;
  }

  legend {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--steel);
    font-weight: 600;
    padding: 0 0 8px 0;
    border-bottom: 2px solid var(--accent);
    margin-bottom: 14px;
    width: 100%;
  }

  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 5px;
    color: var(--navy-light);
  }

  .req::after {
    content: " *";
    color: var(--danger);
  }

  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 14px;
    font-family: inherit;
    background: var(--white);
    color: var(--navy);
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(224,138,30,0.15);
  }

  textarea { resize: vertical; min-height: 100px; }

  .radio-row {
    display: flex;
    gap: 18px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .radio-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
    margin-bottom: 0;
  }

  .radio-row input { width: auto; margin: 0; }

  button {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: var(--white);
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }

  button:hover { background: #c67716; }

  .hint {
    font-size: 12px;
    color: var(--steel);
    margin: -10px 0 16px 0;
  }

  #status {
    text-align: center;
    margin-top: 16px;
    font-weight: 600;
  }

  .ok { color: #1a7a3c; }
  .err { color: var(--danger); }
</style>
</head>
<body>

<header>
  <h1>Fleet Wolf Support</h1>
  <p>Troubleshooting &amp; Service Request Form</p>
</header>

<div class="wrap">
  <form id="troubleshootForm">

    <fieldset>
      <legend>Your Information</legend>

      <label class="req" for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label class="req" for="company">Company Name</label>
      <input type="text" id="company" name="company" required>

      <label class="req" for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required>

      <label class="req" for="email">Email Address</label>
      <input type="email" id="email" name="email" required>
    </fieldset>

    <fieldset>
      <legend>Vehicle / Device Details</legend>

      <label for="vehicle">Vehicle / Unit Name or Number</label>
      <input type="text" id="vehicle" name="vehicle" placeholder="e.g. Truck 12, Van 4">

      <label for="serial">Device Serial Number (if known)</label>
      <input type="text" id="serial" name="serial" placeholder="Found on the Geotab device label">
      <p class="hint">Not sure? Leave blank and we'll look it up.</p>
    </fieldset>

    <fieldset>
      <legend>Issue Details</legend>

      <label class="req" for="issueType">Type of Issue</label>
      <select id="issueType" name="issueType" required>
        <option value="">Select an issue type</option>
        <option value="No GPS / device offline">No GPS / device offline</option>
        <option value="Camera not working">Camera not working</option>
        <option value="Incorrect data or reports">Incorrect data or reports</option>
        <option value="Installation issue">Installation issue</option>
        <option value="App / login issue">App / login issue</option>
        <option value="Billing question">Billing question</option>
        <option value="Other">Other</option>
      </select>

      <label class="req">Urgency</label>
      <div class="radio-row">
        <label><input type="radio" name="urgency" value="Low" required> Low</label>
        <label><input type="radio" name="urgency" value="Medium" required> Medium</label>
        <label><input type="radio" name="urgency" value="High"> High &ndash; vehicle down</label>
      </div>

      <label class="req" for="started">When did this start?</label>
      <input type="text" id="started" name="started" placeholder="e.g. This morning, 3 days ago" required>

      <label class="req" for="description">Describe the Issue</label>
      <textarea id="description" name="description" required placeholder="Please include as much detail as possible &ndash; what you're seeing, any error messages, and what you've already tried."></textarea>
    </fieldset>

    <button type="submit">Submit Request</button>
    <div id="status"></div>
  </form>
</div>

<script>
  const form = document.getElementById('troubleshootForm');
  const status = document.getElementById('status');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    status.textContent = 'Sending...';
    status.className = '';

    const formData = new FormData(form);

    try {
      const response = await fetch('https://formspree.io/f/mykrvlaz', {
        method: 'POST',
        body: formData,
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        status.textContent = 'Request submitted! We\'ll be in touch shortly.';
        status.className = 'ok';
        form.reset();
      } else {
        status.textContent = 'Something went wrong. Please try again or call us directly.';
        status.className = 'err';
      }
    } catch (error) {
      status.textContent = 'Something went wrong. Please try again or call us directly.';
      status.className = 'err';
    }
  });
</script>

</body>
</html>
